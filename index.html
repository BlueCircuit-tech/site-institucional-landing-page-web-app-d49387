<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arbita — Sistema de Gestão Arbitral</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#f9f8f3',
              100: '#f0ede0',
              200: '#e0d9bf',
              300: '#cec29a',
              400: '#baa773',
              500: '#a98f52',
              600: '#8f7645',
              700: '#705d38',
              800: '#52472c',
              900: '#0A0A0A',
            },
            dourado: {
              50: '#fdf9eb',
              100: '#faf0cc',
              200: '#f5e299',
              300: '#efd166',
              400: '#e8c040',
              500: '#D4AF37',
              600: '#aa8d2c',
              700: '#806b21',
              800: '#554916',
              900: '#2b270b',
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'serif'],
            body: ['"Source Sans 3"', 'sans-serif'],
          },
          boxShadow: {
            'app': '0 4px 20px rgba(0,0,0,0.15)',
            'card': '0 2px 8px rgba(0,0,0,0.08)',
            'card-hover': '0 4px 16px rgba(0,0,0,0.12)',
          },
          borderRadius: {
            'app': '24px',
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Source Sans 3', sans-serif; background: #e8e6e1; min-height: 100vh; }
    h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }

    .app-frame {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #FAFAFA;
      position: relative;
      box-shadow: 0 0 0 8px #1a1a1a, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.3);
      border-radius: 40px;
      overflow: hidden;
    }
    @media (max-width: 440px) {
      .app-frame { box-shadow: none; border-radius: 0; max-width: 100%; }
    }

    .status-bar {
      height: 44px;
      background: #0A0A0A;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      color: #FAFAFA;
      font-size: 13px;
      font-weight: 500;
    }
    .status-bar svg { width: 18px; height: 18px; fill: currentColor; }

    .app-content {
      padding-bottom: 90px;
      min-height: calc(100vh - 44px);
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: #0A0A0A;
      display: flex;
      justify-content: space-around;
      padding: 12px 8px 20px;
      border-radius: 24px 24px 0 0;
      z-index: 100;
    }
    @media (max-width: 440px) {
      .nav-bar { border-radius: 0; width: 100%; max-width: 100%; }
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #888;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s, transform 0.15s;
      padding: 4px 8px;
    }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item.ativo { color: #D4AF37; transform: translateY(-2px); }
    .nav-item:hover { color: #D4AF37; }

    [data-tela]:not(.hidden) {
      animation: fadeSlide 0.3s ease-out;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: 'Source Sans 3', sans-serif;
    }
    .btn-primary {
      background: #D4AF37;
      color: #0A0A0A;
    }
    .btn-primary:hover { background: #c9a32e; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: transparent;
      color: #D4AF37;
      border: 2px solid #D4AF37;
    }
    .btn-secondary:hover { background: rgba(212, 175, 55, 0.1); }
    .btn-ghost {
      background: transparent;
      color: #666;
    }
    .btn-ghost:hover { background: rgba(0,0,0,0.04); }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.04);
    }
    .card-hover:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      transform: translateY(-1px);
      transition: all 0.2s;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-ativa { background: #e8f5e9; color: #2e7d32; }
    .badge-pendente { background: #fff3e0; color: #e65100; }
    .badge-concluida { background: #e3f2fd; color: #1565c0; }
    .badge-cancelada { background: #ffebee; color: #c62828; }

    .input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Source Sans 3', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }
    .input:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }
    .input::placeholder { color: #aaa; }

    .toast-container {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: calc(100% - 32px);
      max-width: 380px;
    }
    .toast {
      padding: 14px 18px;
      border-radius: 12px;
      color: #fff;
      font-weight: 500;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      animation: toastIn 0.3s ease-out;
    }
    .toast.saindo { animation: toastOut 0.3s ease-in forwards; }
    .toast-ok { background: #2e7d32; }
    .toast-erro { background: #c62828; }
    .toast-info { background: #1565c0; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-20px); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }
    .modal-overlay.ativo { opacity: 1; visibility: visible; }
    .modal-content {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.25s;
    }
    .modal-overlay.ativo .modal-content { transform: scale(1); }
    .modal-header {
      padding: 20px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { margin: 0; font-size: 18px; color: #0A0A0A; }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .modal-close:hover { background: #e0e0e0; }
    .modal-body { padding: 20px; }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 16px 0;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="status-bar">
      <span id="hora-atual">14:32</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM13 18h-2v-2h2v2zm0-4h-2V9h2v5z"/></svg>
      </div>
    </div>

    <main class="app-content">
      <!-- TELAS -->
    </main>

    <nav class="nav-bar">
      <div class="nav-item" data-nav="painel-principal" onclick="mostrarTela('painel-principal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Início</span>
      </div>
      <div class="nav-item" data-nav="meus-processos" onclick="mostrarTela('meus-processos')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Processos</span>
      </div>
      <div class="nav-item" data-nav="agenda-e-audiencias" onclick="mostrarTela('agenda-e-audiencias')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Agenda</span>
      </div>
      <div class="nav-item" data-nav="notificacoes" onclick="mostrarTela('notificacoes')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Alertas</span>
      </div>
      <div class="nav-item" data-nav="relatorios-gerenciais" onclick="mostrarTela('relatorios-gerenciais')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Relatórios</span>
      </div>
    </nav>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <div id="modal" class="modal-overlay" onclick="fecharModalNoClique(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-titulo"></h3>
        <button class="modal-close" onclick="fecharModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-corpo" class="modal-body"></div>
    </div>
  </div>

  <script>
    function toast(mensagem, tipo = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast-${tipo}`;
      el.textContent = mensagem;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('saindo');
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    function abrirModal(html, titulo = '') {
      document.getElementById('modal-titulo').textContent = titulo;
      document.getElementById('modal-corpo').innerHTML = html;
      document.getElementById('modal').classList.add('ativo');
      document.body.style.overflow = 'hidden';
    }

    function fecharModal() {
      document.getElementById('modal').classList.remove('ativo');
      document.body.style.overflow = '';
    }

    function fecharModalNoClique(e) {
      if (e.target.id === 'modal') fecharModal();
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    function brl(valor) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
    }

    function dataBR(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR');
    }

    function atualizarHora() {
      const agora = new Date();
      const h = String(agora.getHours()).padStart(2, '0');
      const m = String(agora.getMinutes()).padStart(2, '0');
      document.getElementById('hora-atual').textContent = `${h}:${m}`;
    }
    atualizarHora();
    setInterval(atualizarHora, 60000);

    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('painel-principal');
    });
  </script>
</body>
</html>
